<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0c0b0a" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0c0b0a" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0b0a" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShadowQuest" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="description"
      content="ShadowQuest — a futuristic personal operating system with RPG-inspired progression. Turn real-life action into real-life growth."
    />
    <title>ShadowQuest — Personal OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&family=Oswald:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&family=Shippori+Mincho:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- =========================================================
         SITE LOADER — critical CSS (instant paint, before bundle)
         This is YOUR loader, now the official site loader. It shows
         the moment HTML parses, before React/JS loads, and is then
         seamlessly taken over by <Boot /> in React.
         ========================================================= -->
    <style id="sq-critical-loader">
/* Shared verbatim with src/styles/loader.css. Panels alone provide coverage. */
#sq-initial-loader { position: fixed; inset: 0; z-index: 99999; background: transparent; overflow: hidden; isolation: isolate; color: #eeeae1; font-family: Arial, sans-serif; }
#sq-initial-loader .boot__panel { position: absolute; top: 0; bottom: 0; width: 20.2%; background: #08090c; z-index: -1; }
#sq-initial-loader .boot__panel:nth-child(6) { left: 0; }
#sq-initial-loader .boot__panel:nth-child(7) { left: 20%; }
#sq-initial-loader .boot__panel:nth-child(8) { left: 40%; }
#sq-initial-loader .boot__panel:nth-child(9) { left: 60%; }
#sq-initial-loader .boot__panel:nth-child(10) { left: 80%; }
#sq-initial-loader .sq-load-atmosphere { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, #a936211c, transparent 55%); transition: opacity .3s; }
#sq-initial-loader .sq-load-atmosphere::after { content: ''; position: absolute; inset: 24px; border: 1px solid #ffffff0b; }
#sq-initial-loader .sq-load-top { position: absolute; top: 46px; left: 48px; right: 48px; display: flex; justify-content: space-between; font-size: 10px; letter-spacing: .24em; color: #92918e; }
#sq-initial-loader .sq-load-top b { color: #f16649; font-weight: 400; }
#sq-initial-loader .sq-load-center { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; }
#sq-initial-loader .sq-load-orbit { position: relative; width: 154px; height: 154px; margin-bottom: 42px; animation: sq-emerge .8s ease both; }
#sq-initial-loader .sq-load-orbit::before, #sq-initial-loader .sq-load-orbit::after { content: ''; position: absolute; border-radius: 50%; inset: 0; border: 1px solid #ffffff12; border-top-color: #f16649; border-right-color: #f1664960; animation: sq-orbit 2.6s linear infinite; }
#sq-initial-loader .sq-load-orbit::after { inset: 15px; border: 1px dashed #bcb4a64a; border-bottom-color: #f16649; animation-direction: reverse; animation-duration: 8s; }
#sq-initial-loader .sq-load-symbol { position: absolute; inset: 36px; display: grid; place-items: center; font-family: Georgia, serif; font-size: 44px; color: #f16649; text-shadow: 0 0 35px #ef563e66; animation: sq-breathe 2s ease-in-out infinite alternate; }
#sq-initial-loader .sq-load-title { margin: 0; font-size: clamp(27px, 5.5vw, 62px); font-weight: 400; letter-spacing: .22em; padding-left: .22em; animation: sq-emerge .9s .15s both; }
#sq-initial-loader .sq-load-title span { font-weight: 700; }
#sq-initial-loader .sq-load-subtitle { margin: 17px 0 0; font-size: 9px; letter-spacing: .4em; color: #99928a; animation: sq-emerge .9s .3s both; }
#sq-initial-loader .sq-load-bottom { position: absolute; bottom: 54px; left: 50%; width: min(360px, calc(100% - 96px)); transform: translateX(-50%); }
#sq-initial-loader .sq-load-readout { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
#sq-initial-loader [data-boot-stage] { color: #aaa39a; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
#sq-initial-loader .sq-load-number { font-size: 26px; font-variant-numeric: tabular-nums; font-weight: 300; }
#sq-initial-loader .sq-load-number small { font-size: 10px; color: #7d7974; margin-left: 5px; }
#sq-initial-loader .sq-load-track { height: 1px; background: #ffffff20; overflow: hidden; }
#sq-initial-loader [data-boot-fill] { display: block; height: 100%; background: #f16649; transform: scaleX(0); transform-origin: left; box-shadow: 0 0 12px #f16649; }
#sq-initial-loader .sq-load-hint { display: block; text-align: center; margin-top: 18px; color: #78736d; font-size: 9px; letter-spacing: .12em; }
#sq-initial-loader .boot__blade { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: #f16649; transform: scaleX(0); transform-origin: left; }
#sq-initial-loader.is-exiting .boot__blade { animation: boot-blade .3s ease forwards; }
#sq-initial-loader.is-exiting .boot__panel { animation: boot-panel .72s cubic-bezier(.76,0,.24,1) .22s forwards; }
#sq-initial-loader.is-exiting .boot__panel:nth-child(7) { animation-delay: .28s; }
#sq-initial-loader.is-exiting .boot__panel:nth-child(8) { animation-delay: .34s; }
#sq-initial-loader.is-exiting .boot__panel:nth-child(9) { animation-delay: .40s; }
#sq-initial-loader.is-exiting .boot__panel:nth-child(10) { animation-delay: .46s; }
#sq-initial-loader.is-exiting .sq-load-center, #sq-initial-loader.is-exiting .sq-load-top, #sq-initial-loader.is-exiting .sq-load-bottom { animation: sq-depart .3s ease forwards; }
#sq-initial-loader.is-exiting .sq-load-atmosphere { opacity: 0; }
@keyframes boot-panel { to { transform: translateY(-101%); } }
@keyframes boot-blade { to { transform: scaleX(1); opacity: 0; } }
@keyframes sq-orbit { to { transform: rotate(360deg); } }
@keyframes sq-breathe { to { opacity: .55; transform: scale(.94); } }
@keyframes sq-emerge { from { opacity: 0; translate: 0 15px; } to { opacity: 1; translate: 0 0; } }
@keyframes sq-depart { to { opacity: 0; translate: 0 -15px; } }
@media (max-width: 600px) { #sq-initial-loader .sq-load-top { top: 30px; left: 30px; right: 30px; font-size: 8px; } #sq-initial-loader .sq-load-atmosphere::after { inset: 14px; } #sq-initial-loader .sq-load-orbit { width: 126px; height: 126px; margin-bottom: 32px; } #sq-initial-loader .sq-load-symbol { inset: 25px; } }
@media (max-height: 550px) { #sq-initial-loader .sq-load-orbit { width: 80px; height: 80px; margin-bottom: 12px; } #sq-initial-loader .sq-load-symbol { inset: 10px; font-size: 30px; } #sq-initial-loader .sq-load-bottom { bottom: 22px; } }
@media (prefers-reduced-motion: reduce) { #sq-initial-loader { display: none !important; } }
</style>

    <!-- One address, one app: a retired host (shadow-quest.onrender.com, the
         old static site with no API behind it) forwards to the live one
         before React boots, handoff code and all. External file because the
         production CSP is script-src 'self'; deferred so the loader above
         still paints first. See public/sq-canonical.js. -->
    <script defer src="/sq-canonical.js"></script>
  </head>
  <body>
    <!-- ================= THE SITE LOADER (only one) =================
         This IS the site loader — the single source of truth. It renders
         instantly, before React loads. Plays on every navigation (?noloader skips it), skippable, reduced-motion safe.
         Driver: /sq-loader.js — React only waits for `sq:initial-loader-done`.
         ========================================================== -->
    <div id="sq-initial-loader" role="status" aria-label="Preparing ShadowQuest">
      <div class="sq-load-atmosphere" aria-hidden="true"></div>
      <div class="sq-load-top" aria-hidden="true"><span>SQ / SHADOWQUEST</span><b>THE JOURNEY BEGINS</b></div>
      <div class="sq-load-center" aria-hidden="true"><div class="sq-load-orbit"><span class="sq-load-symbol">影</span></div><h1 class="sq-load-title">SHADOW<span>QUEST</span></h1><p class="sq-load-subtitle">DISCIPLINE BECOMES DESTINY</p></div>
      <div class="sq-load-bottom" aria-hidden="true"><div class="sq-load-readout"><span data-boot-stage>Entering the shadows</span><span class="sq-load-number"><span data-boot-num>000</span><small>/ 100</small></span></div><div class="sq-load-track"><span data-boot-fill></span></div><span class="sq-load-hint">TAP OR PRESS ANY KEY TO SKIP</span></div>
      <span class="boot__blade" aria-hidden="true"></span>
      <div class="boot__panel"></div>
      <div class="boot__panel"></div>
      <div class="boot__panel"></div>
      <div class="boot__panel"></div>
      <div class="boot__panel"></div>
    </div>

    <div id="root"></div>

    <!-- Site loader logic — external file only (CSP-safe: production builds
         block inline scripts via script-src 'self', so the driver lives in
         /sq-loader.js and must never be inlined here). -->
    <script src="/sq-loader.js"></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# android.yml — build the ShadowQuest APK and publish it to a GitHub Release.
#
# Two triggers:
#   · push a tag  v*          → a release build, published as a Release
#   · workflow_dispatch       → the same, on demand, from the Actions tab
#                               ("Build Android APK" → Run workflow)
#
# The APK wraps the *same* web build the site ships (`npm run build` →
# `dist` → `npx cap sync android`), so the app in the APK and the app in the
# browser are one artefact. Point it at the real backend by setting the
# repository variable VITE_API_BASE_URL; leave it unset and the APK runs the
# in-page engine exactly like the un-configured site.
#
# Signing: with no secrets configured this produces a **debug-signed** APK —
# installable on any device, which is what you want for sideloading and
# testing. Add the four KEYSTORE_* secrets and the same run produces a
# release-signed APK instead, with no other change.
name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name to stamp (e.g. 1.1.0)"
        required: false
        default: "1.1.0"

permissions:
  contents: write

jobs:
  apk:
    name: Assemble APK + publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version || '1.1.0' }}"
          fi
          # versionCode must be a monotonically increasing integer.
          CODE=$(date +%s | cut -c1-9)
          echo "name=${V}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "Building v${V} (code ${CODE})"

      - name: Install dependencies
        run: npm ci

      # The launcher icons and splash in this APK are cut from public/icons/icon.svg,
      # which is itself generated. If the geometry in scripts/brand.mjs was changed
      # without regenerating, this build would ship an icon nobody designed — so the
      # shell refuses to continue. (docs/BRAND.md §6)
      - name: Check brand assets match the generator
        run: npm run brand:check

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Decode signing keystore (optional)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release-signed APK
        if: steps.keystore.outputs.have == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -PversionCode="${{ steps.ver.outputs.code }}" \
            -Pandroid.injected.signing.store.file=/tmp/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Assemble debug-signed APK
        if: steps.keystore.outputs.have != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -PversionCode="${{ steps.ver.outputs.code }}"

      - name: Stage artefact
        id: apk
        run: |
          mkdir -p out
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            SRC=android/app/build/outputs/apk/release/app-release.apk
            NAME="ShadowQuest-v${{ steps.ver.outputs.name }}-release.apk"
          else
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
            NAME="ShadowQuest-v${{ steps.ver.outputs.name }}-debug.apk"
          fi
          cp "$SRC" "out/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la out

      - name: Upload APK as run artefact
        uses: actions/upload-artifact@v4
        with:
          name: shadowquest-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.name }}"
          NOTES="## ShadowQuest ${TAG} — Android APK

          Install: download the APK below, then open it on the device
          (Settings → allow install from this source). It is the same build
          the web app ships; the backend it talks to is the one configured at
          build time.

          - \`versionName\` ${{ steps.ver.outputs.name }}
          - \`versionCode\` ${{ steps.ver.outputs.code }}
          - web bundle: \`npm run build\` @ ${GITHUB_SHA}
          "
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "out/${{ steps.apk.outputs.name }}" --clobber
          else
            gh release create "$TAG" "out/${{ steps.apk.outputs.name }}" \
              --title "ShadowQuest ${TAG} — Android" \
              --notes "$NOTES"
          fi

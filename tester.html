<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LifeRPG — Browser API Tester</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: #171b2e;
      --card: #1e2440;
      --line: #2d355c;
      --text: #eef1ff;
      --muted: #9aa3c7;
      --gold: #e7c56a;
      --xp: #7ee0a8;
      --danger: #ff7b8a;
      --accent: #7c8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Segoe UI, system-ui, sans-serif;
      background: radial-gradient(circle at top, #1a2150, var(--bg) 45%);
      color: var(--text);
    }
    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: rgba(15, 18, 32, 0.9);
      position: sticky;
      top: 0;
    }
    h1 { margin: 0; font-size: 20px; }
    h1 span { color: var(--gold); }
    .status { color: var(--muted); font-size: 13px; }
    .ok { color: var(--xp); }
    .bad { color: var(--danger); }
    main {
      display: grid;
      grid-template-columns: 280px 1fr 1fr;
      min-height: calc(100vh - 64px);
    }
    nav {
      border-right: 1px solid var(--line);
      padding: 16px;
      background: var(--panel);
    }
    nav button {
      width: 100%;
      text-align: left;
      margin: 0 0 8px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
    }
    nav button.active, nav button:hover { border-color: var(--gold); }
    section, aside { padding: 20px; }
    aside {
      border-left: 1px solid var(--line);
      background: #12162a;
    }
    label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #101427;
      color: var(--text);
    }
    textarea { min-height: 70px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    button.run {
      background: var(--accent);
      color: white;
      border: 0;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    pre {
      background: #0b0e1c;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      overflow: auto;
      max-height: calc(100vh - 140px);
      font-size: 12px;
      white-space: pre-wrap;
    }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .chip { background: var(--card); border: 1px solid var(--line); padding: 6px 10px; border-radius: 999px; font-size: 12px; }
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
      nav, aside { border: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>LifeRPG <span>browser tester</span></h1>
      <div class="status">API: <code>http://localhost:5000</code> · keep <code>npm run dev</code> running</div>
    </div>
    <div>
      <div id="conn" class="status">Checking server…</div>
      <div class="stats">
        <span class="chip">Lv <b id="sLevel">-</b></span>
        <span class="chip">XP <b id="sXp">-</b></span>
        <span class="chip">Gold <b id="sGold">-</b></span>
        <span class="chip">Streak <b id="sStreak">-</b></span>
      </div>
    </div>
  </header>
  <main>
    <nav id="steps"></nav>
    <section>
      <h2 id="title"></h2>
      <p class="hint" id="hint"></p>
      <div id="form"></div>
      <div class="row">
        <button class="run" id="run">Run this step</button>
      </div>
    </section>
    <aside>
      <h2>Response</h2>
      <pre id="out">Click a step, then Run.</pre>
    </aside>
  </main>
  <script>
    const API = "http://localhost:5000";
    const state = {
      token: localStorage.getItem("liferpg_token") || "",
      questId: localStorage.getItem("liferpg_quest") || "",
      itemId: localStorage.getItem("liferpg_item") || "",
      email: "sam" + Date.now() + "@example.com"
    };

    const steps = [
      {
        id: "health",
        title: "1. Health check",
        hint: "Confirms the backend is running. No login needed.",
        method: "GET",
        path: "/api/health"
      },
      {
        id: "register",
        title: "2. Register",
        hint: "Creates a player at level 1, 0 XP, 0 gold, and returns a JWT.",
        method: "POST",
        path: "/api/auth/register",
        fields: [
          { name: "name", value: "Sam" },
          { name: "email", value: state.email },
          { name: "password", value: "password123" }
        ]
      },
      {
        id: "login",
        title: "3. Login",
        hint: "Use the same email/password. Saves a new token.",
        method: "POST",
        path: "/api/auth/login",
        fields: [
          { name: "email", value: state.email },
          { name: "password", value: "password123" }
        ]
      },
      {
        id: "me",
        title: "4. Current player",
        hint: "GET /api/auth/me — your stats from the JWT.",
        method: "GET",
        path: "/api/auth/me",
        auth: true
      },
      {
        id: "dashboard",
        title: "5. Dashboard",
        hint: "One call for the home screen: player, XP bar, quests, achievements, inventory.",
        method: "GET",
        path: "/api/user/dashboard",
        auth: true
      },
      {
        id: "create",
        title: "6. Create quest",
        hint: "Do NOT send XP/gold. Server sets hard = 200 XP / 100 gold.",
        method: "POST",
        path: "/api/quests",
        auth: true,
        fields: [
          { name: "title", value: "Study for 1 hour" },
          { name: "description", value: "Deep work session" },
          { name: "difficulty", value: "hard" },
          { name: "category", value: "study" },
          { name: "recurrence", value: "none" }
        ]
      },
      {
        id: "list",
        title: "7. List my quests",
        hint: "Only YOUR quests. Other users cannot see these.",
        method: "GET",
        path: "/api/quests",
        auth: true
      },
      {
        id: "getOne",
        title: "8. Get one quest",
        hint: "Uses the quest id saved from Create.",
        method: "GET",
        path: () => "/api/quests/" + savedQuest(),
        auth: true
      },
      {
        id: "update",
        title: "9. Update quest",
        hint: "Change title. Status cannot be set to completed here.",
        method: "PUT",
        path: () => "/api/quests/" + savedQuest(),
        auth: true,
        fields: [{ name: "title", value: "Study for 2 hours" }]
      },
      {
        id: "complete",
        title: "10. Complete quest",
        hint: "Awards XP + gold, streak, achievements. Watch levelUp and rewards.",
        method: "POST",
        path: () => "/api/quests/" + savedQuest() + "/complete",
        auth: true
      },
      {
        id: "dup",
        title: "11. Duplicate complete (should fail)",
        hint: "Same quest again must return 409. Anti-cheat.",
        method: "POST",
        path: () => "/api/quests/" + savedQuest() + "/complete",
        auth: true
      },
      {
        id: "history",
        title: "12. Productivity history",
        hint: "Completion log with XP/gold snapshots.",
        method: "GET",
        path: "/api/history",
        auth: true
      },
      {
        id: "shop",
        title: "13. Shop items",
        hint: "Iron Sword is 200 gold. One hard quest = 100 gold, so complete two hard quests before buying.",
        method: "GET",
        path: "/api/shop/items",
        auth: true
      },
      {
        id: "buy",
        title: "14. Buy Iron Sword",
        hint: "Price comes from the database. Sending price:1 would still charge 200.",
        method: "POST",
        path: () => "/api/shop/items/" + savedItem() + "/buy",
        auth: true
      },
      {
        id: "inventory",
        title: "15. Inventory",
        hint: "Sword should appear with quantity 1.",
        method: "GET",
        path: "/api/inventory",
        auth: true
      },
      {
        id: "achievements",
        title: "16. Achievements",
        hint: "First Quest should be unlocked after step 10.",
        method: "GET",
        path: "/api/achievements",
        auth: true
      },
      {
        id: "profile",
        title: "17. Update profile",
        hint: "Name can change. xp/gold/level in the body are ignored.",
        method: "PUT",
        path: "/api/user/profile",
        auth: true,
        fields: [
          { name: "name", value: "Sam the Hero" },
          { name: "xp", value: "99999" },
          { name: "gold", value: "99999" }
        ]
      },
      {
        id: "logout",
        title: "18. Logout",
        hint: "Blacklists the JWT.",
        method: "POST",
        path: "/api/auth/logout",
        auth: true
      },
      {
        id: "after",
        title: "19. After logout (should fail)",
        hint: "Same token must return 401.",
        method: "GET",
        path: "/api/auth/me",
        auth: true
      }
    ];

    let current = 0;
    const nav = document.getElementById("steps");
    steps.forEach((step, i) => {
      const b = document.createElement("button");
      b.textContent = step.title;
      b.onclick = () => select(i);
      nav.appendChild(b);
    });

    function savedQuest() {
      return state.questId || "QUEST_ID_MISSING";
    }
    function savedItem() {
      return state.itemId || "ITEM_ID_MISSING";
    }
    function pathOf(step) {
      return typeof step.path === "function" ? step.path() : step.path;
    }

    function select(i) {
      current = i;
      [...nav.children].forEach((el, idx) => el.classList.toggle("active", idx === i));
      const step = steps[i];
      document.getElementById("title").textContent = step.title;
      document.getElementById("hint").textContent = step.hint + "  " + step.method + " " + pathOf(step);
      const form = document.getElementById("form");
      form.innerHTML = "";
      (step.fields || []).forEach((field) => {
        const label = document.createElement("label");
        label.textContent = field.name;
        const input = document.createElement("input");
        input.name = field.name;
        input.value = field.value;
        form.appendChild(label);
        form.appendChild(input);
      });
    }

    function bodyFromForm() {
      const data = {};
      document.querySelectorAll("#form input").forEach((input) => {
        data[input.name] = input.value;
      });
      return data;
    }

    function paintPlayer(user) {
      if (!user) return;
      document.getElementById("sLevel").textContent = user.level ?? "-";
      document.getElementById("sXp").textContent = user.xp ?? "-";
      document.getElementById("sGold").textContent = user.gold ?? "-";
      document.getElementById("sStreak").textContent = user.streak ?? "-";
    }

    async function run() {
      const step = steps[current];
      const headers = { "Content-Type": "application/json" };
      const tokenToSend = state.token;
      if (step.auth && tokenToSend) headers.Authorization = "Bearer " + tokenToSend;
      const opts = { method: step.method, headers };
      if (step.fields) opts.body = JSON.stringify(bodyFromForm());
      let result;
      try {
        const res = await fetch(API + pathOf(step), opts);
        const json = await res.json();
        result = { httpStatus: res.status, ...json };
      } catch (err) {
        result = { error: err.message, hint: "Is npm run dev running on port 5000?" };
      }
      document.getElementById("out").textContent = JSON.stringify(result, null, 2);

      const data = result.data || {};
      if (data.token) {
        state.token = data.token;
        localStorage.setItem("liferpg_token", state.token);
      }
      if (data.user) paintPlayer(data.user);
      if (data.player) paintPlayer(data.player);
      if (data.quest && data.quest._id) {
        state.questId = data.quest._id;
        localStorage.setItem("liferpg_quest", state.questId);
      }
      if (data.items && data.items[0]) {
        const sword = data.items.find((item) => item.name === "Iron Sword") || data.items[0];
        state.itemId = sword._id;
        localStorage.setItem("liferpg_item", state.itemId);
      }
      if (step.id === "logout") {
        /* keep token so step 19 can prove blacklist */
      }
    }

    async function ping() {
      try {
        const res = await fetch(API + "/api/health");
        const json = await res.json();
        document.getElementById("conn").innerHTML = res.ok
          ? '<span class="ok">Server is up</span>'
          : '<span class="bad">Server responded badly</span>';
        if (!json.success) throw new Error();
      } catch {
        document.getElementById("conn").innerHTML = '<span class="bad">Cannot reach localhost:5000 — start npm run dev</span>';
      }
    }

    document.getElementById("run").onclick = run;
    select(0);
    ping();
  </script>
</body>
</html>
